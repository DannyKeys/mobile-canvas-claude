name: check-upstream
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Compare pinned tag against latest release
        id: compare
        run: |
          PINNED=$(node -p "require('./runtimes/manifest.json').distribution.tag")
          LATEST=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Redth/mobile-canvas-ghcp/releases/latest | node -p \
            "JSON.parse(require('fs').readFileSync(0,'utf8')).tag_name")
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then echo "changed=false" >> "$GITHUB_OUTPUT";
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Sync upstream-owned files
        if: steps.compare.outputs.changed == 'true'
        run: node scripts/sync-upstream.mjs "${{ steps.compare.outputs.latest }}"

      - name: Open pull request
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/upstream-${{ steps.compare.outputs.latest }}
          title: "chore: bump upstream engine to ${{ steps.compare.outputs.latest }}"
          commit-message: "chore: bump upstream engine to ${{ steps.compare.outputs.latest }}"
          body: |
            Automated bump from ${{ steps.compare.outputs.pinned }} to ${{ steps.compare.outputs.latest }}.

            Only the five upstream-owned files changed. Before merging, re-verify the
            three coupling points, none of which fails loudly:

            - [ ] `resolveCommand()` is still exported from `lib/runtime.mjs`
            - [ ] `canvas open --json` still returns `{url, title}` (undocumented verb, no compatibility promise)
            - [ ] `node --test tests/mcp-smoke.test.mjs` passes, confirming no `mobile_device_*` tool the skills call was renamed
            - [ ] Smoke test on a real device: `ui_find` → `ui_tap` → `screenshot`
