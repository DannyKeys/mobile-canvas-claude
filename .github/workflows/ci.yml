name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Enumerated rather than globbed on purpose: tests/canvas.test.mjs needs a
      # booted device and idb_companion, which a hosted runner does not have. A new
      # test file must be added here explicitly.
      - name: Unit tests
        run: node --test tests/canvas-context.test.mjs tests/doctor.test.mjs tests/sync-upstream.test.mjs tests/bump-plugin-version.test.mjs
      - name: MCP smoke test
        run: node --test tests/mcp-smoke.test.mjs
